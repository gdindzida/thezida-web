  (function () {
    var input = document.getElementById('search-input');
    if (!input) return;
    var result = document.getElementById('search-result');
    var noResult = document.querySelector('.search-no-result');
    var bound = false;
    input.addEventListener('focus', function () {
      if (bound) return;
      bound = true;
      searchFunc("\/index.json", 'search-input', 'search-result');
    });
    input.addEventListener('keydown', function (e) { if (e.which === 13) e.preventDefault(); });
    if (result) {
      var observer = new MutationObserver(function (list) {
        if (list.length === 1) {
          if (list[0].addedNodes.length) { if (noResult) noResult.style.display = 'none'; }
          else if (list[0].removedNodes.length) { if (noResult) noResult.style.display = ''; }
        }
      });
      observer.observe(result, { childList: true });
    }
  })();
