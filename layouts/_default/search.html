{{ define "main" }}
<main class="search-page">
    <header class="search-header">
        <h1>{{ .Title }}</h1>
        <div class="search-box">
            <label for="search-input" class="visually-hidden">Search posts</label>
            <input id="search-input" type="search" placeholder="Search posts..." autocomplete="off" spellcheck="false">
        </div>
    </header>
    <div id="search-status" class="search-status"></div>
    <div id="search-results" class="search-results"></div>
</main>
<script>
    window.searchIndexURL = "{{ "index.json" | relURL }}";
</script>
{{ $searchJS := resources.Get "js/search.js" | minify | fingerprint }}
<script src="{{ $searchJS.RelPermalink }}" integrity="{{ $searchJS.Data.Integrity }}" defer></script>
{{ end }}
